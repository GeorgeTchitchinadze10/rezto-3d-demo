<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ember House · 3D demo</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preload" as="image" href="https://pub-3c68559de18f4aee94d127e180937bdd.r2.dev/burger_poster.webp">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
  :root {
    --green: #2fbf71;
    --green-dark: #23a35f;
    --green-pale: #a9e3c3;
    --ink: #1d1f1e;
    --muted: #8d938f;
    --field: #f2f3f2;
    --line: #e6e8e6;
    --bg: #ffffff;
    --page: #eef0ee;
    --hero-a: #f7efe4;
    --hero-b: #e8dccb;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.4 "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, select, input { font: inherit; color: inherit; }
  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    padding-bottom: 170px;
    position: relative;
  }

  /* Demo strip: this is not Rezto's real page */
  .demo-strip {
    background: #1d1f1e;
    color: #f4f4f1;
    font-size: 12px;
    text-align: center;
    padding: 7px 16px;
    letter-spacing: .2px;
  }
  .demo-strip b { color: var(--green-pale); font-weight: 600; }

  /* Header */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 6px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; letter-spacing: 1.5px; font-size: 15px;
  }
  .wordmark .mark {
    width: 30px; height: 30px; border-radius: 9px;
    border: 2px solid var(--ink);
    display: grid; place-items: center; font-size: 13px;
  }
  .wordmark small {
    font-weight: 600; letter-spacing: .4px; font-size: 10px;
    background: var(--field); color: var(--muted);
    padding: 2px 7px; border-radius: 99px;
  }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .pill-green {
    background: var(--green); color: #fff; border: 0; border-radius: 99px;
    padding: 8px 14px; font-weight: 600; font-size: 13px;
  }
  .lang {
    border: 1px solid var(--line); background: #fff; border-radius: 99px;
    padding: 7px 11px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* Venue row */
  .venue {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 12px;
  }
  .venue h1 { font-size: 19px; margin: 0; font-weight: 700; flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .partner {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 99px;
    padding: 5px 10px 5px 5px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .partner i {
    width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 700;
  }

  /* Hero with the 3D dish */
  .hero {
    position: relative; margin: 0 12px;
    border-radius: 34px; overflow: hidden;
    aspect-ratio: 4 / 3.6;
    background: radial-gradient(120% 90% at 50% 35%, var(--hero-a) 0%, var(--hero-b) 100%);
    box-shadow: 0 1px 0 rgba(0,0,0,.04) inset;
  }
  .hero model-viewer {
    width: 100%; height: 100%;
    --poster-color: transparent;
    background: transparent;
  }
  .hero .logo {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    width: 54px; height: 54px; border-radius: 50%;
    background: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; letter-spacing: .5px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .hero .chip {
    position: absolute; top: 18px; right: 14px; z-index: 2;
    background: rgba(255,255,255,.88); backdrop-filter: blur(6px);
    border-radius: 99px; padding: 6px 11px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 6px; pointer-events: none;
  }
  .hero .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .ar-btn {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--green); color: #fff; text-decoration: none;
    border-radius: 99px; padding: 15px 18px;
    font-weight: 700; font-size: 16px;
    box-shadow: 0 8px 24px rgba(35,163,95,.35);
    cursor: pointer;
  }
  .ar-btn:active { transform: scale(.98); background: var(--green-dark); }
  .ar-btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 8px 24px rgba(35,163,95,.35), 0 0 0 0 rgba(47,191,113,.55); }
    50% { box-shadow: 0 8px 24px rgba(35,163,95,.35), 0 0 0 12px rgba(47,191,113,0); }
  }
  .address {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 13px; padding: 10px 20px 0;
  }

  /* Banner shown after arriving from Instagram/Facebook */
  .notice {
    margin: 12px 12px 0; padding: 12px 14px; border-radius: 16px;
    background: #e9f8f0; color: #17643b; font-size: 14px; font-weight: 600;
    display: none;
  }
  .notice.show { display: block; }

  /* Pre-order this dish */
  .dish {
    margin: 16px 12px 0; padding: 14px; border-radius: var(--radius);
    border: 1px solid var(--line);
    display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center;
  }
  .dish img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--hero-a); }
  .dish h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .dish .price { margin-top: 3px; font-size: 14px; }
  .dish .price s { color: var(--muted); margin-left: 6px; }
  .dish .badge {
    display: inline-block; background: #ffe9e4; color: #c2412c;
    font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-left: 6px;
  }
  .dish-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .btn-outline, .btn-solid {
    flex: 1; border-radius: 14px; padding: 11px 10px; font-weight: 600; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-outline { background: #fff; border: 1px solid var(--line); }
  .btn-solid { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
  .btn-solid.added { background: var(--green); border-color: var(--green); }

  /* Booking form */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 16px 10px;
  }
  .section-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .menu-pill {
    display: flex; align-items: center; gap: 6px;
    border: 1.5px solid var(--green); color: var(--green-dark); background: #fff;
    border-radius: 99px; padding: 6px 13px; font-weight: 600; font-size: 13px;
  }
  .fields { display: grid; gap: 10px; padding: 0 12px; }
  .field {
    position: relative; background: var(--field); border-radius: 18px;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 62px;
    transition: box-shadow .2s;
  }
  .field.flash { box-shadow: 0 0 0 2px var(--green); }
  .field.missing { box-shadow: 0 0 0 2px #e0533d; }
  .field .ic {
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; flex: none;
  }
  .field .txt { flex: 1; min-width: 0; }
  .field .label { font-size: 12px; color: var(--muted); }
  .field .value { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field .value.placeholder { color: var(--muted); font-weight: 500; }
  .field select {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .field.disabled { opacity: .55; }
  .chev { color: var(--muted); flex: none; }

  .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 22px 16px 0; }

  /* Bottom bar */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    pointer-events: none;
  }
  .bottom-inner {
    max-width: 480px; margin: 0 auto; background: linear-gradient(rgba(255,255,255,0), #fff 34%);
    padding: 22px 12px calc(12px + env(safe-area-inset-bottom));
    pointer-events: auto;
  }
  .next {
    width: 100%; border: 0; border-radius: 99px; padding: 16px;
    background: var(--green-pale); color: #fff; font-weight: 700; font-size: 16px;
    cursor: pointer; transition: background .2s;
  }
  .next.ready { background: var(--green); }

  /* Live tracking */
  .track-pill {
    margin: 0 0 10px;
    background: #1d1f1e; color: #fff; border: 0; border-radius: 99px;
    padding: 8px 12px 8px 10px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .track-pill .live { width: 8px; height: 8px; border-radius: 50%; background: #ff5b4a; }
  .track-pill .live.blink { animation: blink .6s ease-out; }
  @keyframes blink { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
  .track-pill .n { background: rgba(255,255,255,.16); border-radius: 99px; padding: 1px 7px; }

  /* Sheets and modals */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(20,22,21,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .scrim.show { display: flex; }
  .sheet {
    width: 100%; max-width: 480px; max-height: 86vh; overflow: auto;
    background: #fff; border-radius: 26px 26px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h3 { margin: 4px 0 6px; font-size: 18px; }
  .sheet p { margin: 6px 0; color: #4a4f4c; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
  .sheet .row { display: flex; gap: 8px; margin-top: 14px; }
  .qr { display: grid; place-items: center; padding: 10px 0; }
  .qr svg { width: 200px; height: 200px; }
  .summary { background: var(--field); border-radius: 16px; padding: 12px 14px; margin-top: 10px; font-size: 14px; }
  .summary div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .summary span:first-child { color: var(--muted); }
  .ok { color: var(--green-dark); font-weight: 700; margin-top: 10px; }

  .funnel { display: grid; gap: 6px; margin: 10px 0 14px; }
  .funnel div { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .funnel .bar { grid-column: 1 / -1; height: 6px; border-radius: 9px; background: var(--field); overflow: hidden; }
  .funnel .bar i { display: block; height: 100%; background: var(--green); }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #141615; color: #d6efe1; border-radius: 14px; padding: 10px 12px; max-height: 34vh; overflow: auto; }
  .log div { white-space: pre-wrap; word-break: break-word; }
  .log .t { color: #7d8781; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translateX(-50%) translateY(10px); opacity: 0;
    background: #1d1f1e; color: #fff; border-radius: 99px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; transition: all .25s; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Hidden Quick Look launcher: must stay in the DOM so iOS delivers the
     "Reserve" button tap back to it (WebKit bug 245959). */
  #ql { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="app">

    <span data-i18n="address"></span>

        <span data-i18n="shareBtn"></span>
      </button>
    </div>
  </section>

  <div class="section-head" id="bookHead">
    <h2 data-i18n="bookTitle"></h2>

      <span data-i18n="menu"></span>

<div class="bottom"><div class="bottom-inner">

    <span class="live" id="liveDot"></span><span data-i18n="tracking"></span><span class="n" id="trackN">0</span>

<!-- Live tracking sheet -->

  <h3 data-i18n="qrTitle"></h3>
  <p data-i18n="qrBody"></p>

  <div class="row"><button class="btn-solid" type="button" data-close data-i18n="close"></button></div>
</div></div>

<!-- Next: where Rezto's real flow continues -->
<div class="scrim" id="doneSheet"><div class="sheet">
  <div class="grab"></div>
  <h3 data-i18n="doneTitle"></h3>
  <p data-i18n="doneBody"></p>

  });

  // ---------- AR ----------
  // Which path "See it on your table" takes:
  //   iPhone Safari/Chrome   Quick Look, with a "Reserve a table" button inside AR
  //   iPhone + Instagram     out.html bounce -> instagram://extbrowser/ (opens the real browser)
  //   iPhone + Facebook      a sheet with the two manual taps (no scheme is known to work)
  //   Android Chrome         Scene Viewer, with a "Reserve" link inside AR
  //   Android in-app         Chrome intent back to this page with ?ar=1
  //   Desktop                QR code to open it on a phone
  var ql = $('ql');
  var arBtn = $('arBtn');
  var arPath = '';

  function quickLookHref() {
    var p = new URLSearchParams();
    p.set('callToAction', t('qlCta'));
    p.set('checkoutTitle', t('dishName'));
    p.set('checkoutSubtitle', t('qlSub'));
    p.set('allowsContentScaling', '0');
    p.set('canonicalWebPageURL', shareUrl());
    return DISH.usdz + '#' + p.toString().replace(/\+/g, '%20');
  }

  function sceneViewerHref() {
    var p = new URLSearchParams();
    p.set('file', DISH.glb);
    p.set('mode', 'ar_preferred');
    p.set('resizable', 'false');
    p.set('title', t('dishName') + ' · ' + DISH.price);
    p.set('link', BASE + '?from=ar&reserve=1&lang=' + lang);
    var fallback = BASE + '?ar=unsupported&lang=' + lang;
    return 'intent://arvr.google.com/scene-viewer/1.0?' + p.toString().replace(/\+/g, '%20') +
      '#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end;';
  }

  function chromeIntentHref() {
    var target = new URL(BASE);
    target.searchParams.set('ar', '1');
    target.searchParams.set('from', APP);
    target.searchParams.set('lang', lang);
    return 'intent://' + target.host + target.pathname + target.search +
      '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent(target.href) + ';end';
  }

  function canQuickLook() {
    var a = document.createElement('a');
    return !!(a.relList && a.relList.supports && a.relList.supports('ar'));
  }

  function setupAR() {
    if (IOS && APP === 'instagram') {
      arPath = 'escape_instagram';
      arBtn.href = lang === 'en' ? 'out-en.html' : 'out.html';
    } else if (IOS && APP) {
      arPath = 'escape_manual';
      arBtn.href = '#';
    } else if (IOS) {
      arPath = canQuickLook() ? 'quicklook' : 'escape_manual';
      arBtn.href = '#';
      ql.href = quickLookHref();
    } else if (ANDROID && APP) {
      arPath = 'escape_android';
      arBtn.href = chromeIntentHref();
    } else if (ANDROID) {
      arPath = 'sceneviewer';
      arBtn.href = sceneViewerHref();
    } else {
      arPath = 'qr';
      arBtn.href = '#';
    }
  }

  arBtn.addEventListener('click', function (e) {
    arBtn.classList.remove('pulse');
    track('ar_tap', { path: arPath });
    if (arPath === 'escape_instagram' || arPath === 'escape_android') {
      track('escape_tap', { app: APP });
      return; // real link tap: let the browser follow href
    }
    if (arPath === 'sceneviewer') {
      track('ar_open', { via: 'sceneviewer' });
      return;
    }
    e.preventDefault();
    if (arPath === 'quicklook') {
      ql.href = quickLookHref();
      ql.click();
      track('ar_open', { via: 'quicklook' });
    } else if (arPath === 'escape_manual') {
      track('escape_manual', { app: APP || 'webview' });
      openSheet('escapeSheet');
    } else {
      showQR();
    }
  });

  // "Reserve a table" tapped inside iPhone AR
  ql.addEventListener('message', function (e) {
    if (e.data === '_apple_ar_quicklook_button_tapped') {
      track('ar_reserve_tap', { via: 'quicklook' });
      goToBooking();
    }
  }, false);

  function goToBooking() {
    $('bookHead').scrollIntoView({ behavior: 'smooth', block: 'start' });
    var f = $('fDate').closest('.field');
    f.classList.add('flash');
    setTimeout(function () { f.classList.remove('flash'); }, 2400);
    toast(t('afterAr'));
  }

  function showQR() {
    track('qr_shown');
    var box = $('qrBox');
    box.innerHTML = '';
    if (window.qrcode) {
      var q = window.qrcode(0, 'M');
      q.addData(BASE + '?from=qr&lang=' + lang);
      q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    } else {
      box.textContent = BASE;
    }
    openSheet('qrSheet');
  }

  // ---------- Tracking sheet ----------
  $('trackPill').addEventListener('click', function () { renderTracking(); openSheet('trackSheet'); });
  $('trackReset').addEventListener('click', function () { events = []; once = {}; store('rz_events', events); renderTracking(); });

  // For checking the AR links from a desktop console.
  window.__rz = { quickLookHref: quickLookHref, sceneViewerHref: sceneViewerHref, chromeIntentHref: chromeIntentHref };

  // ---------- Start ----------
  applyLang();
  track('page_view', { device: device, source: source });

  var from = qs.get('from');
  if (qs.get('ar') === '1' && from) {
    track('arrived_from_app', { from: from });
    var n = $('notice');
    n.textContent = t('fromApp');
    n.classList.add('show');
    arBtn.classList.add('pulse');
  } else if (from === 'share') {
    track('arrived_from_share');
  }
  if (qs.get('reserve') === '1' && from === 'ar') {
    track('arrived_from_ar');
    track('ar_reserve_tap', { via: 'sceneviewer' });
    setTimeout(goToBooking, 400);
  }
  if (qs.get('ar') === 'unsupported') {
    track('ar_unsupported');
    toast(t('noAr'));
  }
  if (APP && MOBILE) track('escape_offered', { app: APP });

  // Drop the one-shot flags from the address bar so a reload doesn't replay them.
  if (qs.has('ar') || qs.has('reserve')) {
    qs.delete('ar'); qs.delete('reserve');
    var clean = BASE + (qs.toString() ? '?' + qs.toString() : '');
    try { history.replaceState(null, '', clean); } catch (e) {}
  }
})();
</script>
</body>
</html>
